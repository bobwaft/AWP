[package]
name = "awp"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "awp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
portable-pty = "0.9.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
serde = { version = "1.0.229", features = ["derive"] }
